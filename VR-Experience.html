<style>
  /* =========  RESET & BASE  ========= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #000;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* =========  LETTERBOX STAGE  =========
     The original frames are 16:9. We center a 16:9 stage and letterbox
     it inside the viewport so the layout matches the Figma source exactly. */
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
  }
  #frame {
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100vw;
    max-width: calc(100vh * 16 / 9);
    max-height: 100vh;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 80px rgba(255,255,255,0.04);
  }

  /* =========  SCREEN LAYERING  ========= */
  .screen {
    position: absolute; inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms ease;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* =========  HOTSPOTS  =========
     Invisible clickable rectangles placed in % over the background. */
  .hot {
    position: absolute;
    background: transparent;
    border: 0;
    cursor: pointer;
    border-radius: 14px;
    transition: background 250ms ease, box-shadow 250ms ease, transform 200ms ease;
  }
  .hot:hover {
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 0 30px rgba(255,255,255,0.12) inset;
  }
  .hot.round { border-radius: 50%; }
  .hot.subtle:hover { background: rgba(255,255,255,0.04); }

  /* =========  PROMPT BUBBLE / TOAST  ========= */
  #toast {
    position: absolute;
    left: 50%; bottom: 4%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 18px;
    background: rgba(20,20,28,0.72);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease, transform 400ms ease;
    z-index: 100;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* =========  HINT BLINK on first screen  ========= */
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.35); }
    50%      { box-shadow: 0 0 0 18px rgba(255,255,255,0); }
  }

  /* =========  LOGIN INPUTS  ========= */
  .login-field {
    position: absolute;
    width: 30.5%;
    height: 9%;
    background: transparent;
    border: none;
    color: #fff;
    font-size: clamp(12px, 1.6vw, 22px);
    padding: 0 3.5%;
    outline: none;
    letter-spacing: 0.05em;
  }
  .login-field::placeholder { color: rgba(255,255,255,0.35); }

  /* =========  COMMUNITY input  ========= */
  .community-input {
    position: absolute;
    left: 6%;
    top: 64%;
    width: 51%;
    height: 12%;
    background: transparent;
    border: none;
    color: #fff;
    font-size: clamp(12px, 1.5vw, 20px);
    padding: 0 4%;
    outline: none;
    font-style: italic;
  }
  .community-input::placeholder { color: rgba(255,255,255,0.45); font-style: italic; }

  /* =========  CAMERA FLASH  ========= */
  #flash {
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 200;
  }
  #flash.fire { animation: flash 0.5s ease-out; }
  @keyframes flash {
    0%   { opacity: 0; }
    20%  { opacity: 0.95; }
    100% { opacity: 0; }
  }

  /* =========  ACHIEVEMENT UNLOCK FX  ========= */
  #unlock-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 150;
    opacity: 0;
    background:
      radial-gradient(circle at center, rgba(255,210,120,0.35) 0%, rgba(0,0,0,0) 60%);
    transition: opacity 800ms ease;
  }
  #unlock-fx.show { opacity: 1; }

  /* =========  WARP / TRANSITION  ========= */
  #warp {
    position: absolute; inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    z-index: 180;
    transition: opacity 400ms ease;
  }
  #warp.show { opacity: 1; }

  /* =========  HINT FOR NAVIGATING  ========= */
  #helpbar {
    position: fixed;
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    z-index: 500;
    pointer-events: none;
    text-align: center;
  }
  #helpbar kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
  }

  /* small-screen warning */
  @media (max-width: 600px) and (orientation: portrait) {
    #rotate-msg { display: flex !important; }
  }
  #rotate-msg {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    color: #fff;
    z-index: 9999;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
  }
  #rotate-msg h2 { font-size: 28px; margin-bottom: 12px; font-weight: 500; }
  #rotate-msg p { font-size: 14px; color: rgba(255,255,255,0.6); font-family: 'Inter', sans-serif; }

  /* small detail: a flashing planet name on community */
  .greeting-cycle {
    position: absolute;
    left: 50%; top: 41%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 2.6vw, 38px);
    color: #f4c47a;
    text-shadow: 0 0 30px rgba(255,180,80,0.6);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 700ms ease;
  }
  .greeting-cycle.show { opacity: 1; }

  /* RANK animation: subtle floating */
  .floaty { animation: floaty 4s ease-in-out infinite; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

</style>

<script>
  /* =========  STATE  ========= */
  const state = {
    history: ['start'],
    achievements: new Set(),
  };

  /* =========  CORE: GO TO SCREEN  ========= */
  function go(id, opts = {}) {
    const target = document.getElementById('s-' + id);
    if (!target) return;
    const current = document.querySelector('.screen.active');
    if (current === target) return;
    if (current) current.classList.remove('active');
    target.classList.add('active');
    if (!opts.silent) state.history.push(id);
  }
  function back() {
    if (state.history.length < 2) return;
    state.history.pop();
    const prev = state.history[state.history.length - 1];
    go(prev, { silent: true });
  }

  /* =========  TOAST  ========= */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* =========  CAMERA FLASH  ========= */
  function fireFlash() {
    const f = document.getElementById('flash');
    f.classList.remove('fire');
    void f.offsetWidth; // restart anim
    f.classList.add('fire');
  }

  /* =========  WARP TRANSITION  ========= */
  function warpTo(planet) {
    const w = document.getElementById('warp');
    w.classList.add('show');
    setTimeout(() => {
      go('transition');
      w.classList.remove('show');
      toast('Destination set: ' + planet);
    }, 420);
  }

  /* =========  ACHIEVEMENT UNLOCK  ========= */
  function unlockAchievement(name) {
    if (state.achievements.has(name)) {
      go('achievement');
      return;
    }
    state.achievements.add(name);
    const fx = document.getElementById('unlock-fx');
    fx.classList.add('show');
    toast('Achievement unlocked!');
    setTimeout(() => {
      go('achievement');
      setTimeout(() => fx.classList.remove('show'), 800);
    }, 700);
  }

  /* =========  BIND HOTSPOTS  ========= */
  document.querySelectorAll('.hot').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const dest = btn.dataset.goto;
      const toastMsg = btn.dataset.toast;
      const action = btn.dataset.action;

      if (action === 'submit-login') {
        const user = document.getElementById('login-user').value.trim();
        if (!user) {
          toast('Please enter a commander name');
          document.getElementById('login-user').focus();
          return;
        }
        toast('Welcome aboard, ' + user);
        setTimeout(() => go('mode'), 600);
        return;
      }
      if (action === 'warp') {
        warpTo(btn.dataset.planet || 'Destination');
        return;
      }
      if (action === 'camera') {
        fireFlash();
        toast(toastMsg || 'Photo captured');
        return;
      }
      if (action === 'save') {
        toast(toastMsg || 'Saved to logbook');
        return;
      }
      if (action === 'share') {
        toast(toastMsg || 'Link copied');
        return;
      }
      if (action === 'favorite') {
        toast(toastMsg || 'Added to favorites');
        return;
      }
      if (action === 'capture-object') {
        toast(toastMsg || 'Object captured');
        setTimeout(() => unlockAchievement('Object Catcher'), 700);
        return;
      }
      if (action === 'unlock-achievement') {
        unlockAchievement('Outer Space Treaty Witness');
        return;
      }

      if (toastMsg) toast(toastMsg);
      if (dest) go(dest);
    });
  });

  /* =========  KEYBOARD  ========= */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      go('mode');
    } else if (e.key === 'ArrowLeft') {
      back();
    } else if (e.key === 'h' || e.key === 'H') {
      go('destination');
    }
  });

  /* =========  COMMUNITY: GREETING CYCLE  ========= */
  const greetings = [
    'Hello', '你好', 'Hola', 'Bonjour', 'Hallo', 'Ciao',
    'Olá', 'Здравствуйте', 'مرحبا', 'नमस्ते', 'こんにちは',
    'Merhaba', '안녕하세요', 'Sawubona', 'Kia ora'
  ];
  let gi = 0;
  const gEl = document.getElementById('greeting-cycle');
  function cycleGreeting() {
    if (!document.getElementById('s-community-greeting').classList.contains('active')) {
      setTimeout(cycleGreeting, 1500);
      return;
    }
    gEl.textContent = greetings[gi % greetings.length];
    gEl.classList.add('show');
    setTimeout(() => {
      gEl.classList.remove('show');
      gi++;
      setTimeout(cycleGreeting, 400);
    }, 1500);
  }
  setTimeout(cycleGreeting, 800);

  /* =========  PRELOAD IMAGES  ========= */
  const allImgs = [
    'Frame2','Frame3','Frame4','Frame5','Frame6','Frame7','Frame8','Frame9',
    'Frame11','Frame12','Frame13','Frame14','Frame15','Frame16','Frame17',
    'Frame18','Frame19-4752ea29','Frame20-ab726ddd','Frame21-64606acb','Frame23-68491930','Frame25-afdd2fbb'
  ];
  allImgs.forEach(name => {
    const img = new Image();
    img.src = 'uploads/' + name + '.jpg';
  });

  /* =========  HELP BAR AUTO-FADE  ========= */
  setTimeout(() => {
    document.getElementById('helpbar').style.transition = 'opacity 1.5s';
    document.getElementById('helpbar').style.opacity = '0';
  }, 7000);
</script>
