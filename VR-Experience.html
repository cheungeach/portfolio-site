<title>SPACE TRAVEL — VR Experience</title>
<style>
/* Layout: one full-bleed WebGL world that holds every scene; a thin HUD on top for review controls. Single dark look by choice. */
:root{
  --void:#030407;
  --ink:#f4f6fa;
  --mute:rgba(244,246,250,.7);
  --glass:rgba(40,44,54,.66);
  --edge:rgba(255,255,255,.3);
  --signal:#7fd4ff;
  --f-ui:"Fira Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
.chip{pointer-events:auto;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip b{font-weight:500;letter-spacing:.06em}
button.chip,select.chip{cursor:pointer;font:500 13px var(--f-ui)}
select.chip{appearance:none;padding-right:13px}
select.chip option{background:#15181f}
button.chip:hover,select.chip:hover{border-color:#fff}
button.chip:disabled{opacity:.4;cursor:default}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.spacer{flex:1}
.hint{color:var(--mute)}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);border:1px solid var(--edge);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#toast.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--mute);z-index:9;background:var(--void)}
.offscreen{position:fixed;left:-9999px;top:0;width:200px;opacity:0}
#chat{position:fixed;right:16px;bottom:16px;width:min(340px,calc(100% - 32px));height:min(420px,62%);z-index:7;display:flex;flex-direction:column;border-radius:18px;background:rgba(40,46,60,.82);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--edge);font-weight:500}
#chat header small{display:block;font-weight:400;color:var(--mute);font-size:12px}
#chat header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
#msgs p{margin:0;max-width:82%;padding:7px 11px;border-radius:14px;background:rgba(255,255,255,.14);line-height:1.4}
#msgs p.me{align-self:flex-end;background:rgba(127,212,255,.35)}
#chatF{display:flex;gap:6px;padding:10px;border-top:1px solid var(--edge)}
#chatIn{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;color:#fff;outline:0;font:14px var(--f-ui)}
#chatF button{background:rgba(255,255,255,.16);border:1px solid var(--edge);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px var(--f-ui)}
@media (max-width:640px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#flash.go{animation:none}}

function panel(root,lay,rect,d,draw,opts={}){

  const k=Math.min(2,2048/w,2048/h);const cv=document.createElement('canvas');cv.width=Math.max(2,Math.round(w*k));cv.height=Math.max(2,Math.round(h*k));

  const m=new THREE.Mesh(new THREE.PlaneGeometry(mw,mh),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,toneMapped:false,fog:false}));
  const eye=opts.eye||EYE;const p=at(lay,x+w/2,y+h/2,d,eye);m.position.copy(p);m.lookAt(eye.x,p.y,eye.z);
  m.renderOrder=opts.order??10;

  P.redraw=()=>{g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.setTransform(k,0,0,k,0,0);P.regions=[];draw(g,P);t.needsUpdate=true};
  P.region=(id,x,y,w,h,act)=>P.regions.push({id,x,y,w,h,act});

  const m=new THREE.Mesh(new THREE.PlaneGeometry(mw,mw*pxH/pxW),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,toneMapped:false,fog:false}));

const loader=new GLTFLoader();const modelCache={};
function b64ToBuf(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function getModel(name){
  if(!modelCache[name])modelCache[name]=(async()=>{
    const mod=await import('./vr/models/'+name+'.js');
    const cib=window.createImageBitmap;let gl;
    try{window.createImageBitmap=undefined;const pr=loader.parseAsync(b64ToBuf(mod.default),'');window.createImageBitmap=cib;gl=await pr}finally{window.createImageBitmap=cib}
    gl.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return gl.scene})();
  return modelCache[name];
}
// fit a model into a holder: largest dimension = size, centered, facing +Z
async function model(name,size,{byHeight=false,turn=-Math.PI/2}={}){
  const src=await getModel(name);const inner=src.clone(true);inner.rotation.y=turn;
  const b=new THREE.Box3().setFromObject(inner),s=b.getSize(new THREE.Vector3());const sc=size/(byHeight?s.y:Math.max(s.x,s.y,s.z));inner.scale.setScalar(sc);
  const b2=new THREE.Box3().setFromObject(inner),c=b2.getCenter(new THREE.Vector3());inner.position.sub(c);
  const holder=new THREE.Group();holder.add(inner);holder.userData.radius=b2.getSize(new THREE.Vector3()).length()/2;return holder;
}

function targetRing(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.arc(128,128,108,0,Math.PI*2);g.stroke();
  [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx,dy])=>{g.beginPath();g.moveTo(128+dx*90,128+dy*90);g.lineTo(128+dx*124,128+dy*124);g.stroke()});
  const t=new THREE.CanvasTexture(c);return new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,opacity:.7,fog:false}))}
function makeGrabbable(S,holder,key,onCatch,opts={}){
  const r=holder.userData.radius||0.5;
  const hit=new THREE.Mesh(new THREE.SphereGeometry(r*0.75,12,8),new THREE.MeshBasicMaterial({visible:false}));holder.add(hit);
  const ring=targetRing();ring.scale.setScalar(r*2.3);holder.add(ring);
  Object.assign(hit.userData,{kind:'grab',holder,key,onCatch,scan:!!opts.scan});
  holder.userData.home=holder.position.clone();holder.userData.ring=ring;holder.userData.phase=Math.random()*6;
  S.grabs.push(hit);S.floaters.push(holder);return hit;
}
let grab=null;
function catchIt(S,hd){
  const h=hd.holder;S.grabs.splice(S.grabs.indexOf(hd.hit),1);
  const start=h.position.clone(),s0=h.scale.x,t0=performance.now();
  S.anims.push(now=>{const t=Math.min(1,(now-t0)/600);h.scale.setScalar(s0*(1-t));h.position.lerpVectors(start,camera.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,-0.5,0)),t);if(t>=1){h.visible=false;return true}});
  hd.onCatch();
}

const HELLOS='Hello 你好 Hola Bonjour Hallo Ciao Olá Здравствуйте مرحبا नमस्ते สวัสดี Γειά σας Merhaba שלום Jambo こんにちは Sawubona Kia ora Halo Hej Salut Selam Habari Privet Servus Ahoj Cześć Bok Sveiki 안녕하세요 Tere Moi Halló Kumusta Mabuhay Vanakkam Dumela Mhoro'.split(' ');
function wordSprite(word,size=64,color='#fff'){const c=document.createElement('canvas');const g=c.getContext('2d');g.font=`500 ${size}px "Fira Sans"`;const w=Math.ceil(g.measureText(word).width)+20;c.width=w;c.height=size*1.5;g.font=`500 ${size}px "Fira Sans"`;g.fillStyle=color;g.textBaseline='middle';g.fillText(word,10,c.height/2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));s.scale.set(w/c.height*0.5,0.5,1);return s}
scene('community',{n:'21 Community',build(root,S){
  panel(root,L16,[778,70,747,140],3,(g,P)=>txt(g,'Community',P.w/2,110,104,{align:'center'}));
  panel(root,L16,[925,355,344,308],3.4,(g,P)=>{g.strokeStyle='#fff';g.lineWidth=7;rr(g,30,90,284,140,60);g.stroke();g.beginPath();g.arc(112,160,30,0,Math.PI*2);g.arc(232,160,30,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(150,230);g.lineTo(172,200);g.lineTo(194,230);g.stroke();txt(g,'SPACE TRAVEL',P.w/2,290,30,{w:600,align:'center',spacing:3})});
  S.cloud=new THREE.Group();S.cloud.position.copy(EYE);root.add(S.cloud);
  HELLOS.forEach((w,i)=>{const s=wordSprite(w,64);const a=0.75+i/HELLOS.length*(Math.PI*2-1.5)+Math.random()*0.05,el=(Math.random()-0.5)*0.9,d=5+Math.random()*3;if(i%4===0){const fa=(i/HELLOS.length-0.5)*1.3,fe=-0.32-Math.random()*0.18;s.position.set(Math.sin(fa)*d*Math.cos(fe),Math.sin(fe)*d,-Math.cos(fa)*d*Math.cos(fe))}else s.position.set(Math.sin(a)*d*Math.cos(el),Math.sin(el)*d*0.8,-Math.cos(a)*d*Math.cos(el));s.material.opacity=0.65+Math.random()*0.35;S.cloud.add(s)});
  navBar(root,L16,2144,157);avatar(root,L16);
},enter(S){if(S.mine)S.cloud.remove(S.mine);if(G.hello){S.mine=wordSprite(G.hello,72,'#9fe0ff');S.mine.position.set(0,-0.9,-3.6);S.mine.scale.multiplyScalar(1.3);S.cloud.add(S.mine)}},

    if(n==='Earth'){const mp=new THREE.Group();p.add(mp);const mo=planet('moon',0.06);mo.position.x=0.36;mp.add(mo);S.moonPiv=mp}

  navBar(root,L16,2125,157);avatar(root,L16);
},update(dt,S){if(reduce)return;S.orbs.forEach(o=>{o.piv.rotation.y+=dt*o.sp*0.35;o.p.rotation.y+=dt*0.6});if(S.moonPiv)S.moonPiv.rotation.y+=dt*1.2}});

// =====================================================================
// scene switching
// =====================================================================
let cur=null;const hist=[];const roots={};
const view={yaw:0,pitch:0,fov:50};
async function go(id,{noHist=false}={}){
  const S=SC[id];if(!S)return;closeModal();
  if(cur&&cur.id!==id&&!noHist)hist.push(cur.id);
  if(!roots[id]){const root=new THREE.Group();roots[id]=root;root.visible=false;world.add(root);const ld=document.getElementById('loading');ld.hidden=false;
    try{await S.build(root,S)}catch(e){console.error('build',id,e)}ld.hidden=true;S.clickables=null;
    if(S.hud)root.traverse(o=>{if(o.userData&&o.userData.kind==='panel'){o.material.depthTest=false;o.renderOrder=Math.max(o.renderOrder,20)}})}
  if(cur&&roots[cur.id]){roots[cur.id].visible=false;(cur.stages||[]).forEach(s=>s.exit())}
  cur=S;roots[id].visible=true;
  world.background=new THREE.Color(S.bg);world.fog=S.fog?new THREE.Fog(...S.fog):null;stars.visible=S.stars;
  rig.position.set(S.eye.x,0,S.eye.z);camera.position.set(0,S.eye.y,0);view.yaw=0;view.pitch=0;view.fov=S.fov;applyView();
  if(renderer.xr.isPresenting)xrPlace();
  (S.stages||[]).forEach(s=>s.enter());if(S.enter)S.enter(S);
  document.getElementById('where').innerHTML='<b>'+S.n.replace(/^\d+ /,'').toUpperCase()+'</b>';
  document.getElementById('jump').value=id;document.getElementById('back').disabled=!hist.length;
  document.getElementById('hint').textContent=S.grabs.length?'Drag to look around · Press and hold an object to grab it, pull it in to catch it':'Drag to look around · Scroll to zoom';
}
function back(){if(hist.length)go(hist.pop(),{noHist:true})}
function applyView(){if(renderer.xr.isPresenting)return;camera.rotation.set(view.pitch,view.yaw,0,'YXZ');camera.fov=view.fov;camera.updateProjectionMatrix()}
const ORDER=['start','enter','mode','guide','hall','dest','warp','debris','glove','dock','eva','station','rovers','achieve','wall','ranking','share','community','passport','map'];
const jump=document.getElementById('jump');ORDER.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=SC[k].n;jump.appendChild(o)});
jump.onchange=()=>go(jump.value);document.getElementById('back').onclick=back;

// =====================================================================
// input: look, click, hover, grab, spin, scroll
// =====================================================================
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function clickList(S){if(!S.clickables){const list=[];roots[S.id].traverse(o=>{if(o.userData&&(o.userData.kind==='panel'||o.userData.kind==='suit'||o.userData.kind==='spin'||o.userData.kind==='planet'||o.userData.kind==='tap'))list.push(o)});S.clickables=list}return S.clickables}
function castFrom(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);return ray}
function hitTest(rc){if(!cur)return null;const objs=[...(modal?[modal]:[]),...cur.grabs,...clickList(cur)];const hits=rc.intersectObjects(objs,false);
  for(const h of hits){const u=h.object.userData;if(u.kind==='panel'){const reg=regionAt(h);if(reg)return{h,reg};if(u.scroll)return{h,scroll:u.scroll};continue}return{h}}return null}
function regionAt(h){const P=h.object.userData;if(!h.uv)return null;const x=h.uv.x*P.w,y=(1-h.uv.y)*P.h;for(let i=P.regions.length-1;i>=0;i--){const r=P.regions[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r}return null}
let down=null,hoverP=null,hoverId=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const rc=castFrom(e);const t=hitTest(rc);down={x:e.clientX,y:e.clientY,yaw:view.yaw,pitch:view.pitch,t,moved:false};
  if(t&&t.h.object.userData.kind==='grab'){const u=t.h.object.userData;if(u.scan){startScan(u,t.h.object);return}grab={hit:t.h.object,holder:u.holder,onCatch:u.onCatch,dist:t.h.distance,pull:t.h.distance,ray:rc.ray.clone()};canvas.style.cursor='grabbing'}
  if(t&&t.h.object.userData.kind==='spin'){down.spin=t.h.object;t.h.object.userData.dragging=true}
  if(t&&t.scroll)down.scroll=t.scroll;});
canvas.addEventListener('pointermove',e=>{
  const rc=castFrom(e);
  if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>6)down.moved=true;
    if(grab){grab.ray=rc.ray.clone();return}
    if(down.spin){down.spin.rotation.y=(down.spin.userData.r0??(down.spin.userData.r0=down.spin.rotation.y))+dx*0.01;return}
    if(down.scroll){down.scroll(-(e.movementY||0)*1.6);return}
    if(scan)return;
    const k=view.fov/50*0.0042;view.yaw=THREE.MathUtils.clamp(down.yaw+dx*k,cur.yaw[0],cur.yaw[1]);view.pitch=THREE.MathUtils.clamp(down.pitch+dy*k,cur.pitch[0],cur.pitch[1]);applyView();return}
  const t=hitTest(rc);const P=t&&t.reg?t.h.object:null,id=t&&t.reg?t.reg.id:null;
  if(P!==hoverP||id!==hoverId){const old=hoverP;hoverP=P;hoverId=id;if(old){old.userData.hover=null;old.userData.redraw()}if(P){P.userData.hover=id;P.userData.redraw()}}
  canvas.style.cursor=t?(t.h.object.userData.kind==='grab'?'grab':(t.reg||t.h.object.userData.kind!=='panel')?'pointer':'default'):'default';
});
canvas.addEventListener('pointerup',e=>{
  if(grab){const g=grab;grab=null;canvas.style.cursor='default';if(g.pull<1.9&&cur.grabs.includes(g.hit))catchIt(cur,{hit:g.hit,holder:g.holder,onCatch:g.onCatch});else{g.holder.userData.home=g.holder.position.clone()}down=null;return}
  if(scan){cancelScan()}
  if(down&&down.spin){down.spin.userData.dragging=false;down.spin.userData.r0=undefined}
  if(down&&!down.moved&&down.t){const t=down.t;if(t.reg)t.reg.act();else if(t.h.object.userData.act)t.h.object.userData.act()}
  down=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();const t=hitTest(castFrom(e));if(t&&(t.scroll||(t.reg&&t.h.object.userData.scroll))){(t.scroll||t.h.object.userData.scroll)(e.deltaY*0.8);return}
  view.fov=THREE.MathUtils.clamp(view.fov+e.deltaY*0.03,30,70);applyView()},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape'){closeModal();document.getElementById('chat').hidden=true}if(e.key==='Enter'&&cur&&cur.id==='enter')go('mode')});
// scanning (rover): hold for a moment
let scan=null;
function startScan(u,hit){scan={u,hit,t:0};u.holder.userData.ring.material.opacity=1;toast('Scanning… keep holding')}
function cancelScan(){if(scan&&scan.t<1){toast('Scan interrupted');scan.u.holder.userData.ring.material.opacity=.7}scan=null}

// =====================================================================
// WebXR: Vision Pro Safari / Quest browser
// =====================================================================
const xrBtn=document.getElementById('xr');let baseRef=null;
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{xrBtn.hidden=!ok}).catch(()=>{})}
xrBtn.onclick=async()=>{try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','hand-tracking']});renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);baseRef=renderer.xr.getReferenceSpace();camera.rotation.set(0,0,0);xrPlace();s.addEventListener('end',()=>{baseRef=null;go(cur.id,{noHist:true})})}catch(e){toast('VR is not available in this view. Open the page directly in the headset browser.')}};
function xrPlace(){if(cur)rig.position.set(cur.eye.x,0,cur.eye.z)}
const xrRay=new THREE.Raycaster(),tm=new THREE.Matrix4();const xrGrab=[null,null];
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);rig.add(c);
  const cast=()=>{tm.identity().extractRotation(c.matrixWorld);xrRay.ray.origin.setFromMatrixPosition(c.matrixWorld);xrRay.ray.direction.set(0,0,-1).applyMatrix4(tm);return xrRay};
  c.addEventListener('selectstart',()=>{const t=hitTest(cast());if(!t)return;const u=t.h.object.userData;if(u.kind==='grab'){if(u.scan){const Rr=u.onCatch;cur.grabs.splice(cur.grabs.indexOf(t.h.object),1);Rr();return}xrGrab[i]={hit:t.h.object,holder:u.holder,onCatch:u.onCatch,c,dist:t.h.distance}}else if(t.reg)t.reg.act();else if(u.act)u.act()});
  c.addEventListener('selectend',()=>{const g=xrGrab[i];if(!g)return;xrGrab[i]=null;const head=camera.getWorldPosition(new THREE.Vector3());if(g.holder.position.distanceTo(head)<1.2&&cur.grabs.includes(g.hit))catchIt(cur,g);else g.holder.userData.home=g.holder.position.clone()})}

// =====================================================================
// loop
// =====================================================================
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let T=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),0.05);T+=dt;if(!cur)return;
  (cur.stages||[]).forEach(s=>s.update(dt));(cur.ticks||[]).forEach(f=>f(dt));if(cur.update)cur.update(dt,cur,T);
  // floating objects drift and tumble; the target ring pulses
  for(const f of cur.floaters){if(!f.visible||(grab&&grab.holder===f)||xrGrab.some(g=>g&&g.holder===f))continue;const hm=f.userData.home;f.position.y=hm.y+Math.sin(T*0.7+f.userData.phase)*0.06;f.position.x=hm.x+Math.cos(T*0.5+f.userData.phase)*0.04;if(!reduce){f.rotation.y+=dt*0.25;f.rotation.x+=dt*0.08}
    const ring=f.userData.ring;if(ring)ring.material.opacity=0.45+Math.sin(T*3+f.userData.phase)*0.25}
  if(grab){grab.pull=THREE.MathUtils.lerp(grab.pull,1.4,1-Math.pow(0.15,dt));const p=grab.ray.origin.clone().addScaledVector(grab.ray.direction,grab.pull);grab.holder.position.lerp(p,1-Math.pow(0.001,dt));grab.holder.rotation.y+=dt}
  for(let i=0;i<2;i++){const g=xrGrab[i];if(!g)continue;tm.identity().extractRotation(g.c.matrixWorld);const o=new THREE.Vector3().setFromMatrixPosition(g.c.matrixWorld);const d=new THREE.Vector3(0,0,-1).applyMatrix4(tm);g.dist=THREE.MathUtils.lerp(g.dist,0.5,1-Math.pow(0.2,dt));g.holder.position.lerp(o.addScaledVector(d,g.dist),1-Math.pow(0.001,dt))}
  if(scan){scan.t+=dt/1.2;const r=scan.u.holder.userData.ring;r.scale.setScalar((scan.u.holder.userData.radius||1)*2.3*(1-scan.t*0.3));if(scan.t>=1){cur.grabs.splice(cur.grabs.indexOf(scan.hit),1);r.visible=false;scan.u.onCatch();scan=null}}
  cur.anims=cur.anims.filter(a=>!a(performance.now()));
  renderer.render(world,camera);
});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}

await Promise.all(['400 40px "Fira Sans"','500 40px "Fira Sans"','600 40px "Fira Sans"','400 40px "Spectral"','500 40px "Spectral"'].map(f=>document.fonts.load(f).catch(()=>{})));
window.__app={go,SC,G,renderer,world,camera,view,roots,at,LW,L16,closeModal,get cur(){return cur}};
go(location.hash&&SC[location.hash.slice(1)]?location.hash.slice(1):'start');
