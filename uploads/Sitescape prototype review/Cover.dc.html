<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/broadsheet-8516a637-84e5-461b-88a7-d5644fcfd477/styles.css">
  <script src="_ds/broadsheet-8516a637-84e5-461b-88a7-d5644fcfd477/_ds_bundle.js"></script>
</helmet>
<div class="{{ wrapClass }}" style="aspect-ratio: {{ ratio }}; background: {{ bg }}; border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; width: 100%; box-shadow: var(--shadow-sm)">
  <div style="display:flex; align-items:center; gap:5px; padding:6px 8px; background: rgba(255,255,255,.6)">
    <span style="width:6px; height:6px; border-radius:50%; background: var(--color-neutral-300)"></span>
    <span style="width:6px; height:6px; border-radius:50%; background: var(--color-neutral-300)"></span>
    <span style="flex:1; margin-left:4px; font-size:8px; line-height:1; padding:3px 6px; border-radius:var(--radius-sm); background: var(--color-bg); color: var(--color-neutral-700); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ domain }}</span>
  </div>
  <div style="flex:1; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-height:0">
    <sc-if value="{{ isArticle }}" hint-placeholder-val="{{ true }}">
      <div style="height:9px; width:62%; background: var(--color-neutral-800); border-radius:1px"></div>
      <div style="height:4px; width:34%; background: var(--color-neutral-500); border-radius:1px; margin-bottom:4px"></div>
      <div style="height:3px; width:100%; background: var(--color-neutral-600); opacity:.55"></div>
      <div style="height:3px; width:96%; background: var(--color-neutral-600); opacity:.55"></div>
      <div style="height:3px; width:88%; background: var(--color-neutral-600); opacity:.55"></div>
      <div style="height:3px; width:92%; background: var(--color-neutral-600); opacity:.55"></div>
      <div style="height:3px; width:60%; background: var(--color-neutral-600); opacity:.55"></div>
      <div style="flex:1; min-height:18px; margin-top:4px; background: rgba(255,255,255,.7); border-radius:1px"></div>
    </sc-if>
    <sc-if value="{{ isGallery }}" hint-placeholder-val="{{ false }}">
      <div style="height:7px; width:40%; background: var(--color-neutral-800); border-radius:1px; margin-bottom:2px"></div>
      <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:5px; min-height:0">
        <div style="background: rgba(255,255,255,.75)"></div>
        <div style="background: var(--color-neutral-400); opacity:.6"></div>
        <div style="background: var(--color-neutral-400); opacity:.6"></div>
        <div style="background: rgba(255,255,255,.75)"></div>
      </div>
    </sc-if>
    <sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1; display:flex; gap:6px; min-height:0">
        <div style="width:24%; background: rgba(255,255,255,.7); border-radius:1px; padding:5px; display:flex; flex-direction:column; gap:4px">
          <div style="height:3px; width:80%; background: var(--color-neutral-500)"></div>
          <div style="height:3px; width:60%; background: var(--color-neutral-500)"></div>
          <div style="height:3px; width:70%; background: var(--color-neutral-500)"></div>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:5px">
          <div style="height:7px; width:50%; background: var(--color-neutral-800)"></div>
          <div style="flex:1; background: rgba(255,255,255,.7); display:flex; align-items:flex-end; gap:3px; padding:6px">
            <div style="flex:1; height:30%; background: var(--color-neutral-500)"></div>
            <div style="flex:1; height:55%; background: var(--color-neutral-500)"></div>
            <div style="flex:1; height:40%; background: var(--color-neutral-500)"></div>
            <div style="flex:1; height:75%; background: var(--color-neutral-800)"></div>
            <div style="flex:1; height:50%; background: var(--color-neutral-500)"></div>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:200},&quot;cover&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;ratio&quot;:1,&quot;kind&quot;:&quot;article&quot;},&quot;tsType&quot;:&quot;{ratio:number, kind:string}&quot;},&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;mara.design&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'|'c'&quot;},&quot;treatment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;halftone&quot;,&quot;plain&quot;],&quot;default&quot;:&quot;halftone&quot;,&quot;tsType&quot;:&quot;'halftone'|'plain'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.cover || { ratio: 1, kind: 'article' };
    const tint = this.props.tint || 'a';
    const bg = { a: 'var(--color-accent-100)', b: 'var(--color-accent-2-100)', c: 'var(--color-neutral-200)' }[tint];
    const k = c.kind;
    const isArticle = ['article', 'resume', 'about', 'table'].includes(k);
    const isGallery = ['gallery', 'grid'].includes(k);
    return { ratio: c.ratio, bg, domain: this.props.domain || 'example.com', isArticle, isGallery, isApp: !isArticle && !isGallery, wrapClass: this.props.treatment === 'plain' ? '' : 'halftone' };
  }
}
</script>
</body>
</html>
